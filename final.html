<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happiness & Success Reel Viewer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #090a0f;
            color: #f3f4f6;
            overflow-x: hidden;
        }

        .heading-font {
            font-family: 'Outfit', sans-serif;
        }

        /* Glassmorphism card styling */
        .glass-panel {
            background: rgba(15, 17, 23, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-badge {
            background: rgba(239, 68, 68, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(239, 68, 68, 0.45);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 md:p-6 bg-slate-950 text-slate-100">

    <!-- Phone Container Frame (Fully responsive on mobile, frames on desktop) -->
    <div class="w-full h-svh md:h-[844px] md:max-w-md relative bg-black md:rounded-[48px] shadow-2xl overflow-hidden border-0 md:border-[8px] border-slate-800 flex flex-col justify-between select-none">
        
        <!-- Mobile Status Bar Header -->
        <div id="statusBar" class="absolute top-0 left-0 right-0 z-50 px-6 pt-3 pb-2 flex justify-between items-center text-xs font-semibold text-white pointer-events-none transition-colors duration-500 bg-gradient-to-b from-black/80 to-transparent">
            <span id="currentTime">09:41</span>
            <div class="w-20 h-4 bg-black rounded-full mx-auto absolute left-1/2 -translate-x-1/2 top-2 hidden md:block border border-slate-800"></div>
            <div class="flex items-center gap-1.5">
                <i class="fa-solid fa-signal text-[10px]"></i>
                <i class="fa-solid fa-wifi text-[10px]"></i>
                <i class="fa-solid fa-battery-full text-xs"></i>
            </div>
        </div>

        <!-- Reel Content View -->
        <div class="relative w-full h-full bg-black overflow-hidden flex flex-col justify-between">
            
            <!-- STEP 1: PITCH BLACK LOADING SCREEN (6 SECONDS) -->
            <div id="loadingState" class="absolute inset-0 z-40 bg-black flex flex-col items-center justify-center p-6 transition-opacity duration-700 opacity-100">
                <!-- Sleek Minimalist Spinner -->
                <div class="relative w-14 h-14 sm:w-16 sm:h-16 flex items-center justify-center">
                    <div class="absolute inset-0 rounded-full border-4 border-slate-800"></div>
                    <div class="absolute inset-0 rounded-full border-4 border-emerald-500 border-t-transparent animate-spin"></div>
                </div>
            </div>

            <!-- STEP 2: BLANK WHITE 404 SCREEN (2.5 SECONDS) -->
            <div id="whiteErrorState" class="absolute inset-0 z-30 bg-white flex flex-col items-center justify-center p-6 text-black transition-opacity duration-700 opacity-0 pointer-events-none">
                <div class="text-center">
                    <h2 class="text-2xl sm:text-3xl font-extrabold font-mono tracking-tight text-slate-900 mb-2">Error 404</h2>
                    <p class="text-sm sm:text-base font-medium text-slate-600 font-mono">site not found</p>
                </div>
            </div>

            <!-- STEP 3: FINAL DISPLAY CONTENT STATE -->
            <div id="contentState" class="absolute inset-0 z-10 opacity-0 transition-opacity duration-1000 flex flex-col justify-between">
                
                <!-- Background Image (Crystal Theme) -->
                <div class="absolute inset-0 bg-slate-950">
                    <img 
                        id="reelImage"
                        src="https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000&auto=format&fit=crop" 
                        alt="Crystal Background" 
                        class="w-full h-full object-cover object-center"
                        onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1567095761054-7a02e69e5c43?q=80&w=1000&auto=format&fit=crop';"
                    />
                    <!-- Overlay Darkening Gradient for legibility -->
                    <div class="absolute inset-0 bg-gradient-to-b from-black/70 via-black/40 to-black/90"></div>
                </div>

                <!-- Top Navigation Area -->
                <div class="relative z-20 pt-12 px-5 flex justify-start items-center">
                    <!-- Reload Counter Indicator -->
                    <span id="reloadCounterBadge" class="text-[10px] bg-white/10 px-2.5 py-1 rounded-full text-white/80 backdrop-blur-md border border-white/10">
                        Visit #1
                    </span>
                </div>

                <!-- Center Display: Quote & Error Message -->
                <div class="relative z-20 px-6 py-8 my-auto flex flex-col items-center justify-center text-center">
                    
                    <!-- Quote Heading -->
                    <h1 class="heading-font text-xl sm:text-2xl md:text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-200 via-white to-amber-300 drop-shadow-lg leading-relaxed mb-8 max-w-sm">
                        "Success is not the key to happiness, Happiness is the key to success"
                    </h1>

                    <!-- Error Message Overlay Badge -->
                    <div class="glass-badge rounded-2xl px-6 py-4 flex items-center gap-3 text-red-300 shadow-2xl max-w-xs animate-bounce" style="animation-duration: 2.5s;">
                        <div class="w-9 h-9 rounded-full bg-red-500/20 flex items-center justify-center shrink-0 border border-red-500/40">
                            <i class="fa-solid fa-triangle-exclamation text-red-400 text-base"></i>
                        </div>
                        <div class="text-left">
                            <p class="text-sm sm:text-base font-extrabold tracking-wide text-red-100 font-mono">Error 404, site not found</p>
                        </div>
                    </div>

                    <!-- Pinterest Source Link -->
                    <a href="https://www.pinterest.com/pin/cristais-3--3518505953068998/" target="_blank" rel="noopener noreferrer" class="mt-8 inline-flex items-center gap-2 text-xs text-white/70 hover:text-white bg-black/40 px-4 py-2 rounded-full backdrop-blur-md border border-white/10 transition-colors">
                        <i class="fa-brands fa-pinterest text-red-500 text-sm"></i>
                        <span>Original Pinterest Pin</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px] ml-1"></i>
                    </a>

                </div>

                <!-- Bottom Spacer for layout alignment -->
                <div class="relative z-20 p-6"></div>

            </div>

        </div>

        <!-- Phone Bottom Bar Indicator -->
        <div class="w-32 h-1 bg-white/40 rounded-full mx-auto my-2 shrink-0 hidden md:block"></div>
    </div>

    <!-- Script Logic -->
    <script>
        // Realtime Clock Update
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const clockEl = document.getElementById('currentTime');
            if(clockEl) clockEl.textContent = `${hours}:${minutes}`;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // --- Redirect after 2 reloads (3rd total visit/load) ---
        let loadCount = sessionStorage.getItem('reelLoadCount');
        
        if (!loadCount) {
            loadCount = 1;
        } else {
            loadCount = parseInt(loadCount) + 1;
        }
        
        sessionStorage.setItem('reelLoadCount', loadCount);

        // Update indicator badge text
        const badgeEl = document.getElementById('reloadCounterBadge');
        if (badgeEl) {
            badgeEl.textContent = `Visit #${loadCount} of 3`;
        }

        // Trigger redirect on the 3rd load
        if (loadCount >= 3) {
            window.location.href = 'https://www.google.com';
        }
        // ------------------------------------------------------

        let timer1, timer2;

        // 3-Step Transition Sequence Handler
        function startSequence() {
            const loadingState = document.getElementById('loadingState');
            const whiteErrorState = document.getElementById('whiteErrorState');
            const contentState = document.getElementById('contentState');
            const statusBar = document.getElementById('statusBar');

            // Step 1: Ensure initial Pitch Black Loading state
            loadingState.classList.remove('pointer-events-none');
            loadingState.style.opacity = '1';

            whiteErrorState.classList.add('pointer-events-none');
            whiteErrorState.style.opacity = '0';

            contentState.style.opacity = '0';

            statusBar.classList.remove('text-slate-900');
            statusBar.classList.add('text-white');

            // Transition from Step 1 to Step 2 (After 6 Seconds)
            timer1 = setTimeout(() => {
                loadingState.style.opacity = '0';
                loadingState.classList.add('pointer-events-none');

                whiteErrorState.classList.remove('pointer-events-none');
                whiteErrorState.style.opacity = '1';

                // Adapt status bar text color for white background
                statusBar.classList.remove('text-white');
                statusBar.classList.add('text-slate-900');

                // Transition from Step 2 to Step 3 (After 2.5 Seconds)
                timer2 = setTimeout(() => {
                    whiteErrorState.style.opacity = '0';
                    whiteErrorState.classList.add('pointer-events-none');

                    contentState.style.opacity = '1';

                    // Revert status bar text color back to light
                    statusBar.classList.remove('text-slate-900');
                    statusBar.classList.add('text-white');
                }, 2500);

            }, 6000);
        }

        // Start animation sequence on window load
        window.onload = function() {
            startSequence();
        };
    </script>
</body>
</html>
